plugins {
    id 'com.android.application'
}

android {
    namespace 'com.frenciniz.admin'
    compileSdk 35

    defaultConfig {
        applicationId 'com.frenciniz.admin'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
